spring.application.name=movement-service
server.port=${SERVER_PORT:8082}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
server.compression.enabled=true
server.compression.min-response-size=256
spring.mvc.problemdetails.enabled=true

spring.config.import=configserver:${CONFIG_URL:http://config-server:8888}
spring.cloud.config.username=infra
spring.cloud.config.password=${INFRA_PASSWORD}
management.endpoints.web.exposure.include=health,info
