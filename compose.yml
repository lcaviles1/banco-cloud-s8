    "bff-web": {
      "restart": "unless-stopped",
      "mem_limit": "512m",
      "networks": [
        "bank"
      ],
      "build": {
        "context": ".",
        "args": {
          "MODULE": "bff-web"
        }
      },
      "image": "banco-eft/bff-web:1.0.0",
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null || curl -fsS http://localhost:8080/actuator/health >/dev/null"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 30,
        "start_period": "60s"
      },
      "ports": [
        "127.0.0.1:8091:8080"
      ],
      "depends_on": {
        "config-server": {
          "condition": "service_healthy"
        },
        "discovery-server": {
          "condition": "service_healthy"
        },
        "auth-server": {
          "condition": "service_healthy"
        },
        "postgres": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "CONFIG_USER": "${CONFIG_USER}",
        "CONFIG_PASSWORD": "${CONFIG_PASSWORD}",
        "EUREKA_USER": "${EUREKA_USER}",
        "EUREKA_PASSWORD": "${EUREKA_PASSWORD}",
        "BROKER_USER": "${BROKER_USER}",
        "BROKER_PASSWORD": "${BROKER_PASSWORD}",
        "OAUTH_ISSUER": "${OAUTH_ISSUER}",
        "ATM_PIN_HASH": "${ATM_PIN_HASH}",
        "PAYMENTS_WORKER_SECRET": "${PAYMENTS_WORKER_SECRET}",
        "BATCH_WORKERS": "${BATCH_WORKERS}",
        "DB_NAME": "unused",
        "DB_USER": "unused",
        "DB_PASSWORD": "unused"
      }
    },
    "bff-mobile": {
      "restart": "unless-stopped",
      "mem_limit": "512m",
      "networks": [
        "bank"
      ],
      "build": {
        "context": ".",
        "args": {
          "MODULE": "bff-mobile"
        }
      },
      "image": "banco-eft/bff-mobile:1.0.0",
      "healthcheck": {
