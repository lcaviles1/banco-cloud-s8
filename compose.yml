        "interval": "10s",
        "timeout": "5s",
        "retries": 30,
        "start_period": "60s"
      },
      "ports": [
        "127.0.0.1:9000:9000"
      ],
      "volumes": [
        "authdata:/app/runtime"
      ],
      "environment": {
        "OAUTH_ISSUER": "${OAUTH_ISSUER}",
        "WEB_CLI_SECRET": "${WEB_CLI_SECRET}",
        "MOBILE_CLI_SECRET": "${MOBILE_CLI_SECRET}",
        "ATM_CLI_SECRET": "${ATM_CLI_SECRET}",
        "TELLER_CLI_SECRET": "${TELLER_CLI_SECRET}",
        "OPERATOR_CLI_SECRET": "${OPERATOR_CLI_SECRET}",
        "READER_CLI_SECRET": "${READER_CLI_SECRET}",
        "FOREIGN_CLI_SECRET": "${FOREIGN_CLI_SECRET}",
        "PAYMENTS_WORKER_SECRET": "${PAYMENTS_WORKER_SECRET}"
      }
    },
    "accounts-service": {
      "restart": "unless-stopped",
      "mem_limit": "512m",
      "networks": [
        "bank"
      ],
      "build": {
        "context": ".",
        "args": {
