          "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null || curl -fsS http://localhost:8080/actuator/health >/dev/null"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 30,
        "start_period": "60s"
      },
      "ports": [
        "127.0.0.1:8084:8080"
      ],
      "depends_on": {
        "config-server": {
          "condition": "service_healthy"
        },
        "discovery-server": {
          "condition": "service_healthy"
        },
        "auth-server": {
          "condition": "service_healthy"
        },
        "postgres": {
          "condition": "service_healthy"
        }
      },
