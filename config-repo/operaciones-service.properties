spring.datasource.url=jdbc:h2:file:/data/operaciones-service;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always
spring.h2.console.enabled=false
spring.artemis.mode=native
spring.artemis.broker-url=tcp://broker:61616?callTimeout=3000&reconnectAttempts=0
spring.artemis.user=bank
spring.artemis.password=${BROKER_PASSWORD}
spring.jms.template.delivery-mode=persistent
spring.jms.listener.session-transacted=true
