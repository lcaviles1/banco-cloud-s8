<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Banco XYZ Móvil</title>
<style>:root{font-family:Inter,system-ui,sans-serif;color:#10243d}*{box-sizing:border-box}body{margin:0;background:#e9edf4;display:grid;place-items:center;min-height:100vh}.phone{width:min(390px,100%);min-height:760px;background:#f8fafc;border-radius:28px;overflow:hidden;box-shadow:0 20px 60px #10243d30}.head{background:linear-gradient(140deg,#073d80,#0864b7);color:white;padding:32px 24px 70px}.head small{opacity:.75}.card{background:white;margin:-48px 18px 18px;padding:24px;border-radius:18px;box-shadow:0 12px 28px #1b365d18}.balance{font-size:36px;font-weight:800;margin:8px 0 18px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.action{text-align:center;background:#eef5ff;padding:15px 4px;border-radius:13px;font-size:11px;font-weight:700}.last{margin:26px 20px;background:white;border:1px solid #e1e7ef;border-radius:16px;padding:18px;display:flex;justify-content:space-between}.label{color:#66778c;font-size:13px}</style></head>
<body><div style="padding:12px;background:#fff;color:#111"><label>Token OAuth2 <input id="oauthToken" type="password" autocomplete="off" style="width:55%" placeholder="Pegue el access_token de cinco minutos"></label><button onclick="location.reload()">Recargar</button></div><script>document.getElementById('oauthToken').value=prompt('Pegue un JWT con los scopes del canal')||'';const originalFetch=window.fetch.bind(window);window.fetch=(url,options={})=>{options.headers={...options.headers,Authorization:'Bearer '+document.getElementById('oauthToken').value};return originalFetch(url,options)};</script><main class="phone"><header class="head"><small>BANCO XYZ MÓVIL</small><h1 id="hello">Cargando</h1></header><section class="card"><div class="label">Saldo disponible</div><div class="balance" id="balance">—</div><div class="actions" id="actions"></div></section><section class="last"><div><div class="label">Último movimiento</div><strong id="date">—</strong></div><strong id="amount">—</strong></section></main>
<script>const money=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n);fetch('/api/mobile/accounts/101/home').then(r=>r.json()).then(d=>{hello.textContent=d.saludo;balance.textContent=money(d.saldoDisponible);actions.innerHTML=d.acciones.map(x=>`<div class="action">${x}</div>`).join('');date.textContent=d.ultimoMovimiento?.fecha||'Sin movimientos';amount.textContent=money(d.ultimoMovimiento?.monto||0)});</script></body></html>
