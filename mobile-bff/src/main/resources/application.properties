spring.application.name=mobile-bff
server.port=${SERVER_PORT:8092}
clients.accounts.base-url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
clients.movements.base-url=${MOVEMENT_SERVICE_URL:http://localhost:8082}
management.endpoints.web.exposure.include=health,info,metrics
server.compression.enabled=true
server.compression.min-response-size=128
spring.mvc.problemdetails.enabled=true

spring.config.import=configserver:${CONFIG_URL:http://config-server:8888}
spring.cloud.config.username=infra
spring.cloud.config.password=${INFRA_PASSWORD}
management.endpoints.web.exposure.include=health,info
