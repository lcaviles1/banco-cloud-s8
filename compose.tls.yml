services:
  edge:
    image: caddy:2.10.2
    ports:
      - 127.0.0.1:8443:443
    volumes:
      - ./infra/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [bank]
    depends_on:
      bff-web: {condition: service_healthy}
      bff-mobile: {condition: service_healthy}
      bff-atm: {condition: service_healthy}
volumes:
  caddydata: {}
  caddyconfig: {}
