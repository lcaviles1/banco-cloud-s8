services:
  edge:
    image: caddy:2.10.2
    restart: unless-stopped
    environment:
      BANK_DOMAIN: ${BANK_DOMAIN:?Defina BANK_DOMAIN en .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/Caddyfile.cloud:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [bank]
    depends_on:
      bff-web: {condition: service_healthy}
      bff-mobile: {condition: service_healthy}
      bff-atm: {condition: service_healthy}
  accounts-service:
    ports: !reset []
  payments-service:
    ports: !reset []
  customers-service:
    ports: !reset []
volumes:
  caddydata: {}
  caddyconfig: {}
