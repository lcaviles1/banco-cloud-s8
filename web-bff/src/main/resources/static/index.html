<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Banco XYZ Web</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#132238;background:#f3f6fb}*{box-sizing:border-box}
    body{margin:0}.top{background:#072e67;color:white;padding:24px 7vw;display:flex;justify-content:space-between;align-items:center}
    main{max-width:1120px;margin:36px auto;padding:0 24px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}
    h1{margin:0;font-size:34px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#5f6f83}
    .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}.card{background:white;border:1px solid #dce3ed;border-radius:16px;padding:24px;box-shadow:0 8px 24px #1d355710}
    .balance{font-size:40px;font-weight:750;margin:8px 0}.muted{color:#637187}.metric{display:flex;gap:36px;margin-top:24px}.metric b{display:block;font-size:20px}
    table{width:100%;border-collapse:collapse;margin-top:10px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #e7ebf1;font-size:14px}th{color:#637187}.negative{color:#b3261e}.positive{color:#087b45}
    button,input{font:inherit;padding:10px 14px;border-radius:9px}input{border:1px solid #aab5c3;width:110px}button{border:0;background:#ffb000;color:#1d2a39;font-weight:700;cursor:pointer}
    @media(max-width:800px){.grid{grid-template-columns:1fr}.hero{align-items:start;gap:16px;flex-direction:column}}
  </style>
</head>
<body><div style="padding:12px;background:#fff;color:#111"><label>Token OAuth2 <input id="oauthToken" type="password" autocomplete="off" style="width:55%" placeholder="Pegue el access_token de cinco minutos"></label><button onclick="location.reload()">Recargar</button></div><script>document.getElementById('oauthToken').value=prompt('Pegue un JWT con los scopes del canal')||'';const originalFetch=window.fetch.bind(window);window.fetch=(url,options={})=>{options.headers={...options.headers,Authorization:'Bearer '+document.getElementById('oauthToken').value};return originalFetch(url,options)};</script>
  <div class="top"><strong>BANCO XYZ</strong><span>BFF Web · vista completa</span></div>
  <main><div class="hero"><div><div class="eyebrow">Panel bancario</div><h1 id="greeting">Cargando cuenta</h1></div><form id="form"><input id="account" value="101" aria-label="Cuenta"><button>Consultar</button></form></div>
    <div class="grid"><section class="card"><div class="muted">Saldo disponible</div><div id="balance" class="balance">—</div><div id="product" class="muted"></div><div class="metric"><div><span class="muted">Abonos</span><b id="credits">—</b></div><div><span class="muted">Cargos</span><b id="debits">—</b></div><div><span class="muted">Movimientos</span><b id="count">—</b></div></div></section>
    <section class="card"><strong>Últimos movimientos</strong><table><thead><tr><th>Fecha</th><th>Detalle</th><th>Monto</th></tr></thead><tbody id="movements"></tbody></table></section></div></main>
  <script>
    const money=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n);
    async function load(id){const r=await fetch(`/api/web/accounts/${id}/dashboard`);if(!r.ok)throw Error('Cuenta no disponible');const d=await r.json();
      greeting.textContent=`Hola, ${d.cliente.nombreCompleto}`;balance.textContent=money(d.cuenta.saldoDisponible);product.textContent=`${d.cuenta.producto.toUpperCase()} · ${d.cuenta.estado}`;
      credits.textContent=money(d.resumenAnual.totalAbonos);debits.textContent=money(d.resumenAnual.totalCargos);count.textContent=d.resumenAnual.cantidadMovimientos;
      movements.innerHTML=d.movimientosRecientes.slice(0,5).map(m=>`<tr><td>${m.fecha}</td><td>${m.descripcion}</td><td class="${m.monto<0?'negative':'positive'}">${money(m.monto)}</td></tr>`).join('');}
    form.onsubmit=e=>{e.preventDefault();load(account.value).catch(e=>alert(e.message))};load(101);
  </script>
</body></html>
