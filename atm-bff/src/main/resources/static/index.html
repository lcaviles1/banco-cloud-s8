<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cajero Banco XYZ</title>
<style>:root{font-family:system-ui,sans-serif;color:#eef7ff;background:#071828}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center}.atm{width:min(760px,94vw);background:#0b3153;border:10px solid #566879;border-radius:24px;padding:40px;box-shadow:0 24px 80px #0008}.brand{display:flex;justify-content:space-between;color:#8ec9ff;letter-spacing:.12em}.screen{background:#d9f3ff;color:#07304e;padding:34px;margin:24px 0;border-radius:10px;min-height:280px}.balance{font-size:48px;font-weight:800;margin:10px 0}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:14px}button,input{font:inherit;border-radius:8px;padding:16px}button{border:2px solid #7fc9ff;background:#0c416e;color:white;font-weight:700;cursor:pointer}input{border:1px solid #8da3b6;width:120px}.row{display:flex;justify-content:space-between;align-items:center}.error{color:#b00020}</style></head>
<body><div style="padding:12px;background:#fff;color:#111"><label>Token OAuth2 <input id="oauthToken" type="password" autocomplete="off" style="width:55%" placeholder="Pegue el access_token de cinco minutos"></label><button onclick="location.reload()">Recargar</button></div><script>document.getElementById('oauthToken').value=prompt('Pegue un JWT con los scopes del canal')||'';const originalFetch=window.fetch.bind(window);window.fetch=(url,options={})=>{options.headers={...options.headers,Authorization:'Bearer '+document.getElementById('oauthToken').value};return originalFetch(url,options)};</script><main class="atm"><div class="brand"><strong>BANCO XYZ</strong><span>BFF CAJERO SEGURO</span></div><section class="screen"><div class="row"><h1>Bienvenido</h1><label>PIN <input id="pin" type="password" placeholder="PIN de .env" maxlength="8"></label></div><div id="status">Presione consultar saldo</div><div id="balance" class="balance">—</div><div id="account"></div></section><div class="buttons"><button onclick="consult()">CONSULTAR SALDO</button><button onclick="withdraw()">RETIRAR $1.000</button></div></main>
<script>const pinInput=document.getElementById('pin'),statusText=document.getElementById('status'),balanceText=document.getElementById('balance'),accountText=document.getElementById('account');const money=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n);async function call(url,options={}){options.headers={...options.headers,'X-ATM-PIN':pinInput.value};const r=await fetch(url,options);const d=await r.json();if(!r.ok)throw Error(d.detail||d.detalle||'Operación rechazada');return d}async function consult(){try{const d=await call('/api/atm/accounts/101/balance');statusText.textContent='Saldo disponible';balanceText.textContent=money(d.saldoDisponible);accountText.textContent=`Cuenta ${d.cuentaEnmascarada}`}catch(e){statusText.innerHTML=`<span class="error">${e.message}</span>`}}async function withdraw(){try{const d=await call('/api/atm/accounts/101/withdrawals',{method:'POST',headers:{'Content-Type':'application/json'},body:'{"monto":1000}'});statusText.textContent=`Retiro ${d.estado}`;balanceText.textContent=money(d.saldoDisponible);accountText.textContent=`Operación ${d.operacionId.slice(0,8)}`}catch(e){statusText.innerHTML=`<span class="error">${e.message}</span>`}}</script></body></html>
