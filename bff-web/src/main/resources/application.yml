spring:
  application:
    name: bff-web
  config:
    import: "configserver:${CONFIG_URL:http://config-server:8888}"
  cloud:
    config:
      username: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD}
      fail-fast: true
server:
  port: 8080
  # JDBC is used by domain services; BFFs keep no financial state.
